<!doctype html><html><head><meta charset="utf-8"><title>atfield</title>
<style>html,body{margin:0;background:#050403;overflow:hidden}canvas{display:block;width:2560px;height:1600px}</style>
</head><body><canvas id="c"></canvas>
<script src="kit.js"></script>
<script>
// frozen at 72.41 s (drop 1): kick front 0.16 s old, clap shatter ring 0.24 s old
const CX = 1030, CY = 628, U = H;              // field origin, plane unit = frame height
const R = 0.021, V = 0.4, VK = 1.35, VC = 1.1;
const KICK_AGE = 0.16, CLAP_AGE = 0.3, RMAX = 0.5;
const TILT = [0.09, -0.07], ZOOM = 0.97;
const oct = (x, y) => { x = Math.abs(x); y = Math.abs(y); return Math.max(Math.max(x, y), (x + y) * 0.70710678); };
// plane -> screen
function proj(px, py) {
  const rx = px / ZOOM, ry = py / ZOOM, d = 1 - (rx * TILT[0] + ry * TILT[1]);
  return [CX + (rx / d) * U, CY + (ry / d) * U];
}
// synthetic spectrum history: low-band kick envelope at time (t - lag), beats every BEAT
function eLow(lag) {
  const tau = lag + KICK_AGE;                 // time since the frozen kick, going back
  const ph = ((-tau % BEAT) + BEAT) % BEAT;   // time since the kick preceding (t - lag)
  const k = Math.floor(tau / BEAT);
  const acc = [1, 0.8, 0.95, 0.75][((k % 4) + 4) % 4];
  return acc * (Math.exp(-ph / 0.085) * 1.0 + 0.06 * Math.exp(-ph / 0.3));
}
function eHigh(lag, a8) {
  const step = Math.floor(lag * 14), band = Math.floor(a8 * 12);
  return Math.pow(hash(step, band, 5), 3) * 0.9 + 0.1 * noise1(lag * 9 + a8 * 5, 2);
}

function hotCol(I) {
  const k = smoothstep(0.7, 1.6, I), a = [255, 122, 0], b = [255, 176, 0];
  const r = a.map((v, i) => Math.round(v + (b[i] - v) * k));
  return '#' + r.map((v) => v.toString(16).padStart(2, '0')).join('');
}
function field(c) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  // ---- back plane: fine lattice (parallax), faint, everywhere
  {
    const rb = 0.017, p = new Path2D();
    const dx = Math.sqrt(3) * rb, dy = 1.5 * rb;
    for (let row = -50; row <= 50; row++) for (let col = -62; col <= 62; col++) {
      const px = col * dx + (row & 1 ? dx / 2 : 0), py = row * dy;
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 6 + (i * TAU) / 6;
        const [X, Y] = proj((px + rb * Math.cos(a)) * 1.25, (py + rb * Math.sin(a)) * 1.25);
        i ? p.lineTo(X, Y) : p.moveTo(X, Y);
      }
      p.closePath();
    }
    c.strokeStyle = rgba('orange', 0.07); c.lineWidth = 0.8; c.stroke(p);
  }
  // ---- octagon range guides + 8 spokes
  c.lineWidth = 1;
  for (let k = 1; k <= 9; k++) {
    const r = k * 0.12;
    c.beginPath();
    for (let i = 0; i <= 8; i++) { const a = Math.PI / 8 + (i * TAU) / 8, rr = r / Math.cos(Math.PI / 8); const [X, Y] = proj(rr * Math.cos(a), rr * Math.sin(a)); i ? c.lineTo(X, Y) : c.moveTo(X, Y); }
    c.strokeStyle = rgba('orange', k * 0.12 > RMAX ? 0.22 : 0.12); c.stroke();
  }
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8; c.beginPath();
    const [x0, y0] = proj(0.08 * Math.cos(a), 0.08 * Math.sin(a)), [x1, y1] = proj(1.4 * Math.cos(a), 1.4 * Math.sin(a));
    c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = rgba('orange', 0.1); c.stroke();
  }
  // ---- main hex lattice
  const dx = Math.sqrt(3) * R, dy = 1.5 * R;
  const cells = [];
  for (let row = -38; row <= 38; row++) for (let col = -36; col <= 36; col++) {
    const cxp = col * dx + (row & 1 ? dx / 2 : 0), cyp = row * dy;
    const dc = oct(cxp, cyp);
    if (dc > RMAX + 0.04) continue;
    const inside = smoothstep(RMAX + 0.03, RMAX - 0.03, dc);
    const lag = dc / V;
    let eL = Math.pow(smoothstep(0.05, 0.85, eLow(lag)), 1.2);
    const ang = Math.atan2(cyp, cxp), a8 = Math.abs(((ang / (TAU / 8) + 0.5) % 1 + 1) % 1 * 2 - 1);
    const eH = Math.pow(smoothstep(0.3, 1, eHigh(lag, a8)), 2);
    const fd = dc - KICK_AGE * VK;
    const front = Math.exp(-KICK_AGE * 1.6) * Math.exp(-fd * fd / 0.0022);
    const cd = dc - (0.06 + CLAP_AGE * VC);
    const sh = Math.exp(-cd * cd / 0.0006) * 1.0 * inside;
    const spark = hash(row, col, 77) < 0.05 ? 1.0 : 0;
    let I = 0.05 + 1.35 * eL * (1 - 0.35 * dc / RMAX) + 0.3 * eH + 1.3 * front + 1.4 * spark;
    I *= inside;
    cells.push({ cxp, cyp, dc, I, eH, eL: eL * inside, spark, front: front * inside, sh: clamp(sh), row, col, inside });
  }
  for (const k of cells) {
    const { cxp, cyp, I, sh, front } = k;
    const jx = (hash(k.row, k.col, 13) - 0.5) * R * 1.3 * sh, jy = (hash(k.row, k.col, 14) - 0.5) * R * 1.3 * sh;
    const rr = R * (1 - 0.55 * sh * hash(k.row, k.col, 3));
    const poly = (scale) => {
      c.beginPath();
      for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + (i * TAU) / 6; const [X, Y] = proj(cxp + jx + rr * scale * Math.cos(a), cyp + jy + rr * scale * Math.sin(a)); i ? c.lineTo(X, Y) : c.moveTo(X, Y); }
      c.closePath();
    };
    const red = sh > 0.5;
    const hot = red ? '#FF1A1A' : hotCol(I);
    // fill
    poly(0.9);
    c.fillStyle = rgba(hot, clamp(0.03 * k.inside + 0.4 * k.eL + 0.45 * front + 0.3 * k.spark + (red ? 0.3 * sh : 0)));
    c.fill();
    // rim
    poly(0.86);
    c.strokeStyle = rgba(hot, clamp((0.12 + 0.75 * I) * k.inside)); c.lineWidth = 1.8; c.stroke();
    if (I > 1.25 && !red) { c.strokeStyle = rgba('bone', clamp((I - 1.2) * 0.7)); c.lineWidth = 1.2; c.stroke(); }
    // inner echo on the high bands
    if (k.eH > 0.15 || red) { poly(0.48); c.strokeStyle = rgba(hot, clamp(0.25 * k.eH * I + (red ? 0.6 : 0))); c.lineWidth = 1.2; c.stroke(); }
  }
  // ---- kick wavefront line (crisp octagon) + trailing glow, deployed-field rim
  const octLine = (r, col, a, lw) => {
    c.beginPath();
    for (let i = 0; i <= 8; i++) { const an = Math.PI / 8 + (i * TAU) / 8, rr = r / Math.cos(Math.PI / 8); const [X, Y] = proj(rr * Math.cos(an), rr * Math.sin(an)); i ? c.lineTo(X, Y) : c.moveTo(X, Y); }
    c.strokeStyle = rgba(col, a); c.lineWidth = lw; c.stroke();
  };
  const fr = KICK_AGE * VK;
  octLine(fr, 'bone', 0.8, 2.4);
  for (let i = 1; i < 10; i++) octLine(fr - i * 0.004, 'amber', 0.13 * (1 - i / 10), 5);
  octLine(fr + 0.45 * VK * 0.5, 'amber', 0.28, 1.4);
  octLine(RMAX + 0.035, 'amber', 0.95, 3);
  octLine(RMAX + 0.05, 'orange', 0.5, 1);
  octLine(0.06 + CLAP_AGE * VC + 0.03, 'red', 0.55, 1.5);
  // ---- core
  const g = c.createRadialGradient(CX, CY, 0, CX, CY, 150);
  g.addColorStop(0, rgba('bone', 0.95)); g.addColorStop(0.12, rgba('amber', 0.8)); g.addColorStop(0.4, rgba('orange', 0.18)); g.addColorStop(1, rgba('orange', 0));
  c.fillStyle = g; c.fillRect(CX - 160, CY - 160, 320, 320);
  c.restore();
}

function draw(c) {
  field(c);
  // ---- header
  headerStrip(c, 40, 60, W - 80, { tag: 'A.T. FIELD', tagJp: 'ATフィールド', sub: 'ABSOLUTE TERROR FIELD  //  PHASE SPACE DEPLOYMENT', right: 'BAR 37/45  T+04.59', rightJp: '位相空間 展開' });

  // ---- left: field strength + wave pattern
  const lx = 40, lw = 400;
  const r1 = panel(c, lx, 116, lw, 256, { title: 'FIELD STRENGTH', jp: '位相空間強度' });
  txt(c, 'OUTPUT', r1.x + 2, r1.y + 16, 12, rgba('orange', 0.7));
  sevenSeg(c, '3746.2', r1.x, r1.y + 26, 76, rgba('amber', 1), rgba('orange', 0.07), { glow: 10 });
  txt(c, 'MJ', r1.x + r1.w - 30, r1.y + 100, 14, rgba('orange', 0.8), { w: 700 });
  segMeter(c, r1.x, r1.y + 122, r1.w, 20, 30, 0.93, { hotFrom: 0.83 });
  txt(c, 'L', r1.x, r1.y + 168, 12, rgba('orange', 0.8), { w: 700 });
  segMeter(c, r1.x + 20, r1.y + 158, r1.w - 20, 11, 40, 0.86, { hotFrom: 0.9 });
  txt(c, 'R', r1.x, r1.y + 186, 12, rgba('orange', 0.8), { w: 700 });
  segMeter(c, r1.x + 20, r1.y + 176, r1.w - 20, 11, 40, 0.91, { hotFrom: 0.9 });
  const r2 = panel(c, lx, 388, lw, 206, { title: 'WAVE PATTERN', jp: '波形' });
  waveScope(c, r2.x, r2.y, r2.w, r2.h - 14, { t0: 72.4, win: 0.045, col: rgba('amber', 1), gain: 1.1 });
  txt(c, 'PATTERN ORANGE', r2.x, r2.y + r2.h + 2, 11, rgba('orange', 0.75), { w: 600 });
  txt(c, '33.0 MIDI', r2.x + r2.w, r2.y + r2.h + 2, 11, rgba('orange', 0.75), { w: 600, align: 'right' });

  // ---- right: status, octant layers, hex dump
  const rx = W - 440, rw = 400;
  const r3 = panel(c, rx, 116, rw, 262, { title: 'FIELD STATUS', jp: '状態' });
  statusRow(c, r3.x, r3.y + 18, r3.w, 'PHASE SPACE', '位相空間', 'EXPANDED', rgba('green', 1));
  statusRow(c, r3.x, r3.y + 46, r3.w, 'INTEGRITY', '強度', '99.2%', rgba('amber', 1));
  statusRow(c, r3.x, r3.y + 74, r3.w, 'INTERFERENCE', '干渉', 'BREACH', rgba('red', 1), { box: true });
  statusRow(c, r3.x, r3.y + 102, r3.w, 'NEUTRALIZE', '中和', '27.4%', rgba('amber', 1));
  statusRow(c, r3.x, r3.y + 130, r3.w, 'WAVE FRONT', '波面', 'R02', rgba('amber', 1));
  statusRow(c, r3.x, r3.y + 158, r3.w, 'SYNC', '同調', 'LOCKED', rgba('green', 1));
  statusRow(c, r3.x, r3.y + 186, r3.w, 'MAGI', 'マギ', '3/3 承認', rgba('green', 1));
  const r4 = panel(c, rx, 394, rw, 262, { title: 'OCTANT LAYERS', jp: '層' });
  const HZ = ['310', '520', '810', '1.2K', '1.9K', '2.9K', '4.4K', '6.6K'];
  for (let i = 0; i < 8; i++) {
    const yy = r4.y + 4 + i * 27;
    txt(c, `L${i + 1}`, r4.x, yy + 12, 12, rgba('orange', 0.85), { w: 700 });
    segMeter(c, r4.x + 34, yy, r4.w - 110, 14, 24, clamp(0.35 + 0.6 * hash(i, 41)), { hotFrom: 0.85 });
    txt(c, HZ[i], r4.x + r4.w, yy + 12, 11, rgba('orange', 0.65), { align: 'right' });
  }
  panel(c, rx, 672, rw, 470, { title: 'MEMORY DUMP', jp: '記憶領域', fill: 'rgba(8,5,2,0.9)' });
  c.save(); c.font = mono(400, 12);
  for (let r = 0; r < 19; r++) {
    c.fillStyle = rgba(r === 0 ? 'amber' : 'orange', r === 0 ? 0.95 : 0.55 - r * 0.02);
    c.fillText(`${(0xa7f0 + r * 16).toString(16).toUpperCase()}  ${hexData(r, 9, 8)} ${hexData(r + 40, 9, 8)}`, rx + 12, 734 + r * 21.5);
  }
  c.restore();
  jpVertical(c, '絶対恐怖領域', W - 22, 130, 22, rgba('orange', 0.75), true);

  // ---- centre reticle
  c.save();
  c.strokeStyle = rgba('orange', 0.55); c.lineWidth = 1; c.beginPath();
  c.moveTo(CX - 520, CY); c.lineTo(CX - 40, CY); c.moveTo(CX + 40, CY); c.lineTo(CX + 520, CY);
  c.moveTo(CX, CY - 520); c.lineTo(CX, CY - 40); c.moveTo(CX, CY + 40); c.lineTo(CX, CY + 520);
  for (let i = -22; i <= 22; i++) { if (!i) continue; const l = i % 5 ? 4 : 9; c.moveTo(CX + i * 22, CY - l); c.lineTo(CX + i * 22, CY + l); c.moveTo(CX - l, CY + i * 22); c.lineTo(CX + l, CY + i * 22); }
  c.stroke(); c.restore();
  octPath(c, CX, CY, 34); c.strokeStyle = rgba('amber', 0.95); c.lineWidth = 1.5; c.stroke();
  brackets(c, CX - 62, CY - 62, 124, 124, 14, rgba('orange', 0.95), 2);
  for (let i = 1; i <= 4; i++) txt(c, `R-${String(i).padStart(2, '0')}`, CX + i * 0.12 * H * 0.7071 + 6, CY - i * 0.12 * H * 0.7071 - 4, 11, rgba('orange', 0.8), { w: 600 });
  txt(c, 'ORIGIN X+0.000 Y+0.000  θ 2.41°', CX + 72, CY + 84, 11, rgba('orange', 0.85), { w: 600 });
  // clap: breach tag
  c.fillStyle = rgba('ink', 0.85); c.fillRect(CX - 196, CY - 218, 392, 52);
  c.fillStyle = rgba('red', 1); c.fillRect(CX - 190, CY - 212, 380, 40);
  txt(c, 'FIELD BREACH', CX - 175, CY - 184, 20, rgba('ink', 1), { w: 700, track: 4 });
  jpText(c, '侵食検知', CX + 175, CY - 183, 20, rgba('ink', 1), { align: 'right', w: 900 });

  // ---- docked title card, bottom-left
  c.save();
  c.beginPath(); c.moveTo(28, 668); c.lineTo(600, 668); c.lineTo(648, 716); c.lineTo(648, 1172); c.lineTo(28, 1172); c.closePath();
  c.fillStyle = 'rgba(5,4,3,0.92)'; c.fill(); c.strokeStyle = rgba('orange', 0.7); c.lineWidth = 1.5; c.stroke();
  c.restore();
  hazard(c, 28, 1150, 620, 22, 0, rgba('orange', 0.9), null, 18);
  txt(c, 'ABSOLUTE TERROR FIELD', 52, 700, 15, rgba('orange', 1), { w: 700, track: 4 });
  condensed(c, 'A.T.', 44, 918, 280, { sx: 0.58, color: rgba('bone', 1) });
  condensed(c, 'FIELD', 44, 1136, 280, { sx: 0.58, color: rgba('bone', 1) });
  c.font = jp(40, 900, true); c.fillStyle = rgba('orange', 1);
  c.fillText('位相空間', 470, 842); c.fillText('展開', 470, 892);
  evaLabel(c, 472, 928, 'phase space', undefined, { size: 0.9 });
  evaLabel(c, 472, 950, 'expanding', undefined, { size: 0.9, alpha: 0.7 });
  // ---- bottom ticker
  ticker(c, 676, 1162, W - 716, 'A.T. FIELD DEPLOYED // ABSOLUTE TERROR FIELD // 位相空間 展開 // PHASE SPACE EXPANDING // FIELD INTERFERENCE: BREACH // EVA-01 STANDING BY // MAGI CONSENSUS 3/3 //', 420, { color: rgba('orange', 0.75) });
  c.fillStyle = rgba('orange', 0.6); c.fillRect(676, 1172, W - 716, 1);
}
run(draw, { bloom: 0.8, threshold: 0.6, vignette: 0.45, halation: 0.12 });
</script></body></html>
